name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Validate and build UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun test
          bun run build
      - name: Check design tokens
        run: |
          bun scripts/design/check-tokens.ts
          bun scripts/design/check-classes.ts
      - name: Test the Rust build-input helper without Cargo
        run: python3 scripts/macos/tests/test_rust_build_inputs.py
      - name: Test build-runtime configure recovery without a build
        run: python3 scripts/macos/tests/test_runtime_configure_recovery.py
      - name: Validate native code and demo API
        run: |
          cargo +1.99.0 fmt --check
          cargo +1.99.0 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.99.0 test --locked --all-targets --all-features
          cargo +1.99.0 build --locked
      - name: Package unsigned development app
        run: python3 scripts/macos/package-app.py
      - name: Build graphical askpass adapter without elevation
        run: python3 scripts/macos/build-askpass.py
      - name: Verify installation payload and preparation oracles
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-installation.py
      - name: Verify installation transactions and crash recovery without elevation
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-installation-engine.py
      - name: Verify unsigned component packages without installation
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-installation-package.py
      - name: Verify packaged host and component binding without Installer
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-app-component.py
      - name: Validate native pinentry password reader
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-pinentry-consumer.py
      - name: Verify application broker negative oracles
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-broker.py
      - name: Verify asynchronous administration negative oracles
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-admin-client.py
      - name: Verify component operations without Installer or elevation
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-component-client.py
      - name: Verify helper channel negative oracles
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-helper-channel.py
      - name: Verify profile administration isolation
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-profile-administration.py
      - name: Verify route policy negative oracles
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-route-policy.py
      - name: Verify IPsec namespace and request contracts without charon
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ipsec.py
      - name: Verify VICI deadlines and cancellation with independent peers
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-vici-deadlines.py
      - name: Verify IPsec VICI lifecycle and complete candidate snapshots
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ipsec-control.py
      - name: Verify native IPsec producer admission with owned C fixtures
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ipsec-producer.py
      - name: Verify Darwin PF_KEY metadata with SDK and original NAT-T consumer
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-pfkey.py
      - name: Verify PF_KEY read transport with independent datagram peers
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-pfkey-reader.py
      - name: Verify PPP subprocess supervision
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ppp-supervisor.py
      - name: Verify PPP supervision negative oracles
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ppp-supervisor-mutations.py
      - name: Verify bound SSL transport consumer
        run: |
          brew install openssl@4
          python3 scripts/macos/check-transport-consumer.py

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Validate portable core
        run: cargo +1.99.0 test --locked --no-default-features
