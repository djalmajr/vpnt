name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build and test desktop
        run: |
          cargo +1.99.0 build --locked
          cargo +1.99.0 test --locked --all-targets --all-features
      - name: Test the network helper in an isolated network namespace
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
        # the test only touches devices and routes inside its own namespace.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          VPNT_TEST_NETNS=1 cargo +1.99.0 test --locked --test netd_netns
          # The tunnel daemon's XFRM writer creates and removes a real xfrm
          # interface, routes and a rule inside a private network namespace.
          sudo modprobe xfrm_interface
          VPNT_TEST_NETNS=1 cargo +1.99.0 test --locked --test tunneld_xfrm_netns -- --nocapture
          # The handshake case with a private PID namespace skips while the
          # namespaces are restricted; here it must run.
          VPNT_REQUIRE_USERNS=1 cargo +1.99.0 test --locked --all-features --lib \
            tunneld::handshake::tests::private_pid_namespace_observes_writer_pid_zero -- --exact

  linux-openfortivpn:
    # The Linux package ships openfortivpn built with the vpnt patches; this job
    # builds the same client and runs its behavioral checks against loopback.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake pkg-config libssl-dev
      - name: Build openfortivpn with the vpnt patches
        run: |
          bash scripts/linux/build-openfortivpn.sh "$RUNNER_TEMP/openfortivpn" > "$RUNNER_TEMP/openfortivpn-tree"
          tree=$(tail -n 1 "$RUNNER_TEMP/openfortivpn-tree")
          test -x "$tree/openfortivpn"
          echo "OPENFORTIVPN_TREE=$tree" >> "$GITHUB_ENV"
      - name: Allow the fixtures' private user namespaces
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
        # the fixtures only isolate their own loopback network.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check the pin and the password descriptor
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash scripts/linux/check-openfortivpn-pin.sh "$OPENFORTIVPN_TREE/openfortivpn"
          bash scripts/linux/check-openfortivpn-pinentry.sh "$OPENFORTIVPN_TREE/openfortivpn"
      - name: Check the approved local range
        if: hashFiles('scripts/linux/check-openfortivpn-local-cidr.sh') != ''
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/linux/check-openfortivpn-local-cidr.sh "$OPENFORTIVPN_TREE"

  macos:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Validate and build UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun test
          bun run build
      - name: Check design tokens
        run: |
          bun scripts/design/check-tokens.ts
          bun scripts/design/check-classes.ts
      - name: Test the Rust build-input helper without Cargo
        run: python3 scripts/macos/tests/test_rust_build_inputs.py
      - name: Test build-runtime configure recovery without a build
        run: python3 scripts/macos/tests/test_runtime_configure_recovery.py
      - name: Validate native code and demo API
        run: |
          cargo +1.99.0 fmt --check
          cargo +1.99.0 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.99.0 clippy --locked --all-targets --no-default-features -- -D warnings
          cargo +1.99.0 test --locked --all-targets --all-features
          cargo +1.99.0 build --locked
      - name: Exercise SoftHSM certificate listing
        run: |
          brew install softhsm
          # The system openssl is LibreSSL, which lacks `rsa -traditional`;
          # use the OpenSSL 3 that softhsm already depends on.
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          openssl version
          brewed=$(brew list --verbose softhsm | awk '/\/libsofthsm2\.(so|dylib)$/ { print; exit }')
          test -n "$brewed" && test -f "$brewed"
          # Homebrew's Cellar is group-writable (admin), which the module
          # admission refuses by design; list through a private copy in the
          # per-user temporary directory, whose ancestors are not writable by
          # group or others.
          private=$(mktemp -d "$(getconf DARWIN_USER_TEMP_DIR)vpnt-softhsm.XXXXXX")
          trap 'rm -rf "$private"' EXIT
          module="$private/$(basename "$brewed")"
          install -m 0644 "$brewed" "$module"
          otool -L "$module"
          dir=$(cd "$private" && pwd -P)
          while [ "$dir" != / ]; do ls -ld "$dir"; dir=$(dirname "$dir"); done
          ls -ld /
          output=$(mktemp)
          VPNT_TEST_SOFTHSM="$module" cargo +1.99.0 test --locked --test ovpn_token -- --nocapture > "$output" 2>&1 || { cat "$output"; exit 1; }
          cat "$output"
          if grep -q 'skipped:' "$output"; then exit 1; fi
          grep -q '1 passed' "$output"
      - name: Package unsigned development app
        run: python3 scripts/macos/package-app.py
      - name: Validate graphical askpass adapter without elevation
        run: python3 scripts/macos/check-askpass.py
      - name: Validate native pinentry password reader
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-pinentry-consumer.py
      - name: Verify PPP subprocess supervision
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ppp-supervisor.py
      - name: Verify PPP supervision negative oracles
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ppp-supervisor-mutations.py
      - name: Verify bound SSL transport consumer
        run: |
          brew install openssl@4
          python3 scripts/macos/check-transport-consumer.py

  macos-oracles:
    needs: macos
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        group: [installation, control, network]
    env:
      RUST_TEST_THREADS: 4
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Fetch locked Rust dependencies for offline oracles
        run: cargo +1.99.0 fetch --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.group == 'control' || matrix.group == 'network'
        with:
          bun-version: 1.4.4
      - name: Build UI for control and network oracles
        if: matrix.group == 'control' || matrix.group == 'network'
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Verify installation payload and preparation oracles
        if: matrix.group == 'installation'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-installation.py
      - name: Verify installation transactions and crash recovery without elevation
        if: matrix.group == 'installation'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-installation-engine.py
      - name: Verify unsigned component packages without installation
        if: matrix.group == 'installation'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-installation-package.py
      - name: Verify packaged host and component binding without Installer
        if: matrix.group == 'installation'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-app-component.py
      - name: Verify application broker negative oracles
        if: matrix.group == 'control'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-broker.py
      - name: Verify asynchronous administration negative oracles
        if: matrix.group == 'control'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-admin-client.py
      - name: Verify component operations without Installer or elevation
        if: matrix.group == 'control'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-component-client.py
      - name: Verify helper channel negative oracles
        if: matrix.group == 'control'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-helper-channel.py
      - name: Verify profile administration isolation
        if: matrix.group == 'control'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-profile-administration.py
      - name: Verify IPsec namespace and request contracts without charon
        if: matrix.group == 'control'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ipsec.py
      - name: Verify VICI deadlines and cancellation with independent peers
        if: matrix.group == 'control'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-vici-deadlines.py
      - name: Verify IPsec VICI lifecycle and complete candidate snapshots
        if: matrix.group == 'control'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ipsec-control.py
      - name: Verify route policy negative oracles
        if: matrix.group == 'network'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-route-policy.py
      - name: Verify native IPsec producer admission with owned C fixtures
        if: matrix.group == 'network'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-ipsec-producer.py
      - name: Verify Darwin PF_KEY metadata with SDK and original NAT-T consumer
        if: matrix.group == 'network'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-pfkey.py
      - name: Verify PF_KEY read transport with independent datagram peers
        if: matrix.group == 'network'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-pfkey-reader.py

  runtime-handoff:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install runtime fixture prerequisites
        run: brew install openssl@4 m4
      - name: Build the pinned strongSwan, openfortivpn and OpenVPN runtime without elevation
        run: python3 scripts/macos/build-runtime.py --jobs 2
      - name: Verify the OpenVPN management boundary without a tunnel
        run: python3 scripts/macos/check-openvpn-runtime.py
      - name: Verify permanent original-TU handoff fixture
        run: python3 scripts/macos/check-utun-handoff.py
      - name: Verify permanent original-TU protected UDP fixture
        run: python3 scripts/macos/check-protected-udp.py
      - name: Install Rust toolchain for the charon configuration oracle
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Fetch locked Rust dependencies for the offline charon oracle
        run: cargo +1.99.0 fetch --locked
      - name: Exercise the portable OVPN session with the runtime OpenVPN
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: |
          set -euo pipefail
          runtime="${GITHUB_WORKSPACE}/target/vpnt-runtime"
          openvpn="${runtime}/bin/openvpn"
          test -x "$openvpn"
          # The fixture's CA and signer need OpenSSL 3 or later; the openssl in
          # PATH here is OpenSSL 1.1, which refuses req with OPENSSL_CONF=/dev/null.
          fixture_openssl="$(brew --prefix openssl@4)/bin/openssl"
          test -x "$fixture_openssl"
          "$fixture_openssl" version
          # Build first, so the runtime's library path reaches only the tests
          # and the openvpn they start, never rustc or build scripts.
          cargo +1.99.0 test --locked --no-default-features --test ovpn_session --no-run
          status=0
          output="$(DYLD_LIBRARY_PATH="${runtime}/lib" OPENSSL_MODULES="${runtime}/lib/ossl-modules" OPENSSL_CONF=/dev/null VPNT_TEST_OPENVPN="$openvpn" VPNT_TEST_OPENSSL="$fixture_openssl" cargo +1.99.0 test --locked --no-default-features --test ovpn_session -- --nocapture 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "ovpn_session failed with status $status" >&2
            exit "$status"
          fi
          if grep -q 'skipped, VPNT_TEST_OPENVPN is not set' <<<"$output"; then
            echo 'ovpn_session was skipped' >&2
            exit 1
          fi
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$output"; then
            echo 'no ovpn_session test passed' >&2
            exit 1
          fi
      - name: Verify rendered charon configuration with the original strongSwan parser
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 scripts/macos/check-charon-config.py

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install openvpn for the OVPN session test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openvpn
      - name: Validate portable core
        env:
          VPNT_TEST_OPENVPN: /usr/sbin/openvpn
        run: cargo +1.99.0 test --locked --no-default-features
